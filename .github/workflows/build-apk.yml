name: Build Velaris Debug APK

on:
  # APK packaging is explicit; ordinary code pushes must not build an APK.
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore persistent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.VELARIS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > debug.keystore
          else
            echo '::error::Configure VELARIS_DEBUG_KEYSTORE_BASE64. Refusing to create an incompatible temporary signing key.'
            exit 1
          fi

      - name: Test, package and verify APK
        env:
          ANDROID_GRADLE_BIN: gradle
        run: python3 scripts/check-android.py release

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: velaris-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload companion screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chantal-tests-${{ github.sha }}
          path: |
            app/build/reports/chantal-screenshots/
            app/build/reports/tests/
            app/build/test-results/
            build/checks/
          if-no-files-found: warn

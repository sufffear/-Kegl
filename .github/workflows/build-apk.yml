name: Build Velaris Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore persistent signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.VELARIS_DEBUG_KEYSTORE_BASE64 }}
        run: |
          umask 077
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > debug.keystore
          else
            echo '::error::Configure VELARIS_DEBUG_KEYSTORE_BASE64. Refusing to create an incompatible temporary signing key.'
            exit 1
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug

      - name: Test progress persistence and backup restore
        run: gradle :app:testDebugUnitTest --tests 'com.example.Chantal*PersistenceTest' --tests 'com.example.BackupRestoreTest' --tests 'com.example.Workout*Test'

      - name: Verify APK signing certificate
        run: |
          expected='7cb0deb615308fa329eaba824b772767a93f1d2587dec50f6958a9e42794d8c7'
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > signing-report.txt
          actual=$(sed -n 's/^.* certificate SHA-256 digest: //p' signing-report.txt | tr '[:upper:]' '[:lower:]')
          cat signing-report.txt
          grep -q '^Number of signers: 1$' signing-report.txt
          test "$actual" = "$expected" || { echo '::error::Unexpected APK signing certificate'; exit 1; }
          cat signing-report.txt

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: velaris-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload companion screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chantal-tests-${{ github.sha }}
          path: |
            app/build/reports/chantal-screenshots/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: warn
